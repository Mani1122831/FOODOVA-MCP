version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: foodova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: foodova
    networks:
      - foodova-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodova-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/foodova
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - foodova-net
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodova-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodova-net

volumes:
  mongodb_data:

networks:
  foodova-net:
    driver: bridge
